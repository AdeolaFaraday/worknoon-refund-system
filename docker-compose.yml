version: '3.8'

services:
  db:
    image: postgres:15
    container_name: worknoon_db
    restart: always
    environment:
      POSTGRES_USER: worknoon
      POSTGRES_PASSWORD: worknoon_password
      POSTGRES_DB: worknoon_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
