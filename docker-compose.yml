
services:
  db:
    image: postgres:15
    container_name: worknoon_db
    restart: always
    environment:
      POSTGRES_USER: worknoon
      POSTGRES_PASSWORD: worknoon_password
      POSTGRES_DB: worknoon_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: node:22-alpine
    container_name: worknoon_api
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev:api"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://worknoon:worknoon_password@db:5432/worknoon_db?schema=public
      - PORT=3001
      - HOST=0.0.0.0

  web:
    image: node:22-alpine
    container_name: worknoon_web
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && cd apps/web && npx next dev -H 0.0.0.0"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001

volumes:
  pgdata:
